<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>We’ll Be Back Soon — Fidelis</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        line-height: 1.5;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
      }
      .wrap {
        max-width: 32rem;
        width: 100%;
      }
      h1 {
        font-size: clamp(1.5rem, 4vw, 2rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0;
        font-size: clamp(0.95rem, 2.8vw, 1.05rem);
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>We’ll Be Back Soon</h1>
      <p>
        Our store is temporarily offline for updates. Thank you for your patience.
      </p>
    </div>
  </body>
</html>
